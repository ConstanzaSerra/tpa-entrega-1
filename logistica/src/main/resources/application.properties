# Acuerdo entre equipos: Donaciones en :8080, Logistica en :8081
server.port=8081
# URL publica de este servicio (la usa el planificador externo para el callback)
server.public.url=http://localhost:8081
api.donaciones.url=http://localhost:8080
api.planificador.url=http://localhost:8082

# Scheduler de planificacion de rutas:
# - Produccion (calendarizado, horario de baja carga): dejar scheduler.period.minutes vacio
#   y ajustar scheduler.hora (default 02:00).
# - Demo (modo frecuencia): setear scheduler.period.minutes para que corra cada N minutos.
scheduler.hora=02:00
scheduler.period.minutes=1
