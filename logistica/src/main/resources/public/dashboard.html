<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DonaTrack - Seguimiento de Camiones</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { color: #333; }
    .subtitle { color: #666; font-size: 0.9em; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    th { background: #2c7be5; color: white; padding: 10px 14px; text-align: left; }
    td { padding: 10px 14px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #f0f7ff; }
    .barra-fondo { background: #e0e0e0; border-radius: 4px; height: 14px; min-width: 120px; }
    .barra { background: #2c7be5; border-radius: 4px; height: 14px; transition: width .4s; }
    .sin-dato { color: #aaa; font-style: italic; }
    .estado-en-curso { color: #2c7be5; font-weight: bold; }
    .estado-sin-ruta { color: #aaa; }
    #ultima-actualizacion { color: #999; font-size: 0.8em; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Seguimiento de Camiones en Tiempo Real</h1>
  <p class="subtitle">Dashboard actualizado automaticamente cada 5 segundos. Visible para donantes, entidades beneficiarias y administradores.</p>
  <table>
    <thead>
      <tr>
        <th>Camion</th>
        <th>Posicion</th>
        <th>Velocidad</th>
        <th>Ruta activa</th>
        <th>Avance entregas</th>
        <th>Ultima posicion</th>
      </tr>
    </thead>
    <tbody id="tabla-body">
      <tr><td colspan="6" class="sin-dato">Cargando...</td></tr>
    </tbody>
  </table>
  <div id="ultima-actualizacion"></div>

  <script>
    function formatTimestamp(ts) {
      if (!ts) return '<span class="sin-dato">—</span>';
      return new Date(ts).toLocaleTimeString('es-AR');
    }

    function renderBarra(avance) {
      return `<div class="barra-fondo"><div class="barra" style="width:${avance}%"></div></div>
              <small>${avance}%</small>`;
    }

    async function actualizar() {
      try {
        const res = await fetch('/dashboard/camiones');
        const camiones = await res.json();
        const tbody = document.getElementById('tabla-body');

        if (!camiones.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="sin-dato">No hay camiones registrados.</td></tr>';
          return;
        }

        tbody.innerHTML = camiones.map(c => {
          const pos = c.posicion;
          const ruta = c.ruta;

          const coordenadas = pos
            ? `${pos.latitud.toFixed(5)}, ${pos.longitud.toFixed(5)}`
            : '<span class="sin-dato">Sin posicion</span>';

          const velocidad = pos && pos.velocidad != null
            ? `${pos.velocidad.toFixed(1)} km/h`
            : '<span class="sin-dato">—</span>';

          const rutaCell = ruta
            ? `<span class="estado-en-curso">Ruta #${ruta.rutaId} EN CURSO</span>`
            : '<span class="estado-sin-ruta">Sin ruta activa</span>';

          const avanceCell = ruta
            ? `${renderBarra(ruta.avancePorcentaje)} <small>(${ruta.entregasFinalizadas}/${ruta.entregasTotal})</small>`
            : '<span class="sin-dato">—</span>';

          const timestamp = pos ? formatTimestamp(pos.timestamp) : '<span class="sin-dato">—</span>';

          return `<tr>
            <td><strong>${c.patente}</strong><br><small style="color:#999">ID: ${c.camionId}</small></td>
            <td>${coordenadas}</td>
            <td>${velocidad}</td>
            <td>${rutaCell}</td>
            <td>${avanceCell}</td>
            <td>${timestamp}</td>
          </tr>`;
        }).join('');

        document.getElementById('ultima-actualizacion').textContent =
          'Ultima actualizacion: ' + new Date().toLocaleTimeString('es-AR');
      } catch (e) {
        document.getElementById('tabla-body').innerHTML =
          '<tr><td colspan="6" class="sin-dato">Error al obtener datos del servidor.</td></tr>';
      }
    }

    actualizar();
    setInterval(actualizar, 5000);
  </script>
</body>
</html>
